<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.json">
  <title>کارگاه قطعه‌شویی الهائی</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #eee;
      font-family: 'Tahoma', sans-serif;
      padding: 12px;
      min-height: 100vh;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 16px;
    }
    h2 {
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 16px;
    }
    h3 {
      color: #f7971e;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input, select, button {
      width: 100%;
      padding: 14px 16px;
      margin: 6px 0;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #f7971e;
      box-shadow: 0 0 20px rgba(247, 151, 30, 0.2);
      transform: scale(1.02);
    }
    input::placeholder, select::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    button {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #0f0c29;
      border: none;
      font-weight: 700;
      min-height: 52px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(247, 151, 30, 0.3);
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(247, 151, 30, 0.5);
    }
    button:active {
      transform: scale(0.95);
    }
    button.danger {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: none;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
    }
    .section {
      margin: 24px 0;
      padding: 18px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .item {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin: 10px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }
    .item:hover {
      border-color: rgba(247, 151, 30, 0.3);
      transform: translateX(-4px);
      background: rgba(255, 255, 255, 0.08);
    }
    .item > div {
      flex: 1 1 120px;
    }
    .item .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 0 0 auto;
    }
    .item .actions button {
      width: auto;
      padding: 8px 16px;
      min-height: 38px;
      font-size: 13px;
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      background: rgba(255, 255, 255, 0.05);
      font-size: 14px;
      border-radius: 14px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 10px;
      text-align: right;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    th {
      background: linear-gradient(135deg, rgba(247, 151, 30, 0.3), rgba(255, 210, 0, 0.1));
      color: #ffd200;
      font-weight: 700;
    }
    #invoice {
      background: #fff;
      color: #1a1a2e;
      padding: 24px;
      border-radius: 16px;
      display: none;
      direction: rtl;
    }
    #invoice h2 {
      color: #1a1a2e;
      -webkit-text-fill-color: #1a1a2e;
      text-align: center;
      border-bottom: 3px solid #f7971e;
      padding-bottom: 12px;
    }
    #invoice .inv-total {
      font-size: 1.6rem;
      font-weight: bold;
      color: #f7971e;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin: 2px;
    }
    .badge-green {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #fff;
    }
    .badge-red {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
    }
    .badge-yellow {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #0f0c29;
    }
    .empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      padding: 30px;
      font-size: 16px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row > * {
      flex: 1;
    }
    .price-highlight {
      color: #ffd200;
      font-weight: bold;
      font-size: 1.1em;
    }
    .total-highlight {
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }
    @media (max-width: 600px) {
      .container {
        padding: 16px;
        border-radius: 18px;
      }
      .item {
        flex-direction: column;
        align-items: stretch;
      }
      .item > div {
        text-align: center;
      }
      .item .actions {
        justify-content: center;
      }
      h1 {
        font-size: 1.4rem;
      }
      h2 {
        font-size: 1.1rem;
      }
      table {
        font-size: 12px;
      }
      th, td {
        padding: 8px 6px;
      }
      .row {
        flex-direction: column;
      }
      input, select, button {
        font-size: 14px;
        padding: 12px;
      }
    }
    @media print {
      body > *:not(#invoice) {
        display: none !important;
      }
      #invoice {
        display: block !important;
      }
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="container" id="main-page">
  <h1>⚙️ کارگاه قطعه‌شویی الهائی</h1>
  <h2>💰 مجموع بدهی: <span class="total-highlight" id="total-debt">0</span> ریال</h2>
  
  <div class="section">
    <h3>➕ مشتری جدید</h3>
    <input type="text" id="new-name" placeholder="نام مشتری">
    <input type="tel" id="new-phone" placeholder="شماره موبایل">
    <button onclick="addCustomer()">📌 ثبت مشتری</button>
  </div>
  
  <div class="section">
    <h3>🔍 جستجو</h3>
    <input type="text" id="search-input" placeholder="جستجوی مشتری..." oninput="searchCustomer()">
  </div>
  
  <div class="section">
    <h3>👥 لیست مشتریان</h3>
    <div id="customers-list"></div>
  </div>
  
  <div class="section">
    <h3>💾 بکاپ</h3>
    <div class="row">
      <button onclick="exportData()" class="secondary">📤 خروجی</button>
      <button onclick="document.getElementById('import-file').click()" class="secondary">📥 ورودی</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</div>

<div class="container" id="customer-page" style="display:none;">
  <button onclick="backToMain()" class="secondary" style="margin-bottom:12px;">← بازگشت</button>
  <h1>👤 <span id="customer-name"></span></h1>
  
  <div class="section">
    <h3>➕ موتور/قطعه جدید</h3>
    <input type="text" id="new-engine-desc" placeholder="توضیحات">
    <input type="number" id="new-engine-price" placeholder="مبلغ (ریال)" min="0">
    <div class="row">
      <select id="new-engine-sent">
        <option value="false">❌ ارسال نشده</option>
        <option value="true">✅ ارسال شده</option>
      </select>
      <select id="new-engine-paid">
        <option value="false">❌ پرداخت نشده</option>
        <option value="true">✅ پرداخت شده</option>
      </select>
    </div>
    <button onclick="addEngine()">📦 ثبت موتور/قطعه</button>
  </div>
  
  <div class="section">
    <h3>📋 لیست موتورها</h3>
    <div id="engines-list"></div>
  </div>
  
  <div class="section">
    <div class="row">
      <button onclick="printInvoice()">🖨️ چاپ فاکتور</button>
      <button onclick="saveAsImage()">🖼️ تصویر فاکتور</button>
    </div>
  </div>
  
  <div id="invoice">
    <h2>🧾 فاکتور مشتری: <span id="inv-name"></span></h2>
    <p style="text-align:center; color:#666;">شماره: <strong id="inv-number"></strong></p>
    <table>
      <thead><tr><th>ردیف</th><th>شرح</th><th>مبلغ (ریال)</th><th>ارسال</th><th>پرداخت</th></tr></thead>
      <tbody id="invoice-body"></tbody>
    </table>
    <p style="margin:16px 0; color:#666;">
      <strong>شماره کارت:</strong> 5022291503985093<br>
      <strong>به نام:</strong> رضا الهایی
    </p>
    <p style="font-size:1.6rem; text-align:center;">
      مجموع بدهی: <span class="inv-total" id="inv-total">0</span> ریال
    </p>
  </div>
</div>

<script>
const STORAGE_KEY='workshop_data';
let data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"customers":[],"invoice":1}');
let currentId=null;

function formatPrice(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));updateTotal();}

function updateTotal(){
  let sum=0;
  data.customers.forEach(c=>c.engines.forEach(e=>{if(!e.paid)sum+=e.price;}));
  document.getElementById('total-debt').textContent=formatPrice(sum);
}

function renderCustomers(filter=''){
  const list=document.getElementById('customers-list');
  list.innerHTML='';
  const filtered=data.customers.filter(c=>c.name.includes(filter));
  if(!filtered.length){
    list.innerHTML='<div class="empty">📭 مشتری‌ای ثبت نشده</div>';
    return;
  }
  filtered.forEach(c=>{
    let debt=c.engines.reduce((s,e)=>s+(!e.paid?e.price:0),0);
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML='<div><strong>'+c.name+'</strong><br><span style="font-size:13px;color:rgba(255,255,255,0.5);">'+c.phone+'</span></div><div><span class="price-highlight">'+formatPrice(debt)+'</span> ریال</div><div class="actions"><button onclick="goToCustomer('+c.id+')">📂 ورود</button><button class="danger" onclick="deleteCustomer('+c.id+')">✖</button></div>';
    list.appendChild(div);
  });
  updateTotal();
}

function addCustomer(){
  const name=document.getElementById('new-name').value.trim();
  const phone=document.getElementById('new-phone').value.trim();
  if(!name||!phone)return alert('⚠️ نام و شماره موبایل الزامی است');
  data.customers.push({id:Date.now(),name,phone,engines:[]});
  save();
  renderCustomers();
  document.getElementById('new-name').value='';
  document.getElementById('new-phone').value='';
}

function deleteCustomer(id){
  if(!confirm('⚠️ حذف شود؟'))return;
  data.customers=data.customers.filter(c=>c.id!==id);
  save();
  renderCustomers();
}

function searchCustomer(){
  const q=document.getElementById('search-input').value.trim();
  renderCustomers(q);
}

function goToCustomer(id){
  currentId=id;
  const c=data.customers.find(x=>x.id===id);
  document.getElementById('customer-name').textContent=c.name;
  document.getElementById('main-page').style.display='none';
  document.getElementById('customer-page').style.display='block';
  renderEngines();
}

function backToMain(){
  document.getElementById('customer-page').style.display='none';
  document.getElementById('main-page').style.display='block';
  renderCustomers();
}

function renderEngines(){
  const c=data.customers.find(x=>x.id===currentId);
  const list=document.getElementById('engines-list');
  list.innerHTML='';
  if(!c.engines.length){
    list.innerHTML='<div class="empty">📭 موتوری ثبت نشده</div>';
    return;
  }
  c.engines.forEach((e,i)=>{
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML='<div><strong>'+e.desc+'</strong><br><span style="font-size:13px;color:rgba(255,255,255,0.5);">'+formatPrice(e.price)+' ریال</span></div><div><span class="badge '+(e.sent?'badge-green':'badge-red')+'">'+(e.sent?'✅ ارسال':'❌ ارسال')+'</span><span class="badge '+(e.paid?'badge-green':'badge-yellow')+'">'+(e.paid?'✅ پرداخت':'⏳ بدهی')+'</span></div><div class="actions"><button onclick="editEngine('+i+')">✏️</button><button class="danger" onclick="deleteEngine('+i+')">✖</button></div>';
    list.appendChild(div);
  });
}

function addEngine(){
  const desc=document.getElementById('new-engine-desc').value.trim();
  const price=parseInt(document.getElementById('new-engine-price').value)||0;
  const sent=document.getElementById('new-engine-sent').value==='true';
  const paid=document.getElementById('new-engine-paid').value==='true';
  if(!desc||price<=0)return alert('⚠️ شرح و مبلغ معتبر وارد کنید');
  const c=data.customers.find(x=>x.id===currentId);
  c.engines.push({desc,price,sent,paid,date:Date.now()});
  save();
  renderEngines();
  renderCustomers();
  document.getElementById('new-engine-desc').value='';
  document.getElementById('new-engine-price').value='';
}

function deleteEngine(idx){
  if(!confirm('⚠️ حذف شود؟'))return;
  const c=data.customers.find(x=>x.id===currentId);
  c.engines.splice(idx,1);
  save();
  renderEngines();
  renderCustomers();
}

function editEngine(idx){
  const c=data.customers.find(x=>x.id===currentId);
  const e=c.engines[idx];
  const newDesc=prompt('شرح جدید:',e.desc);
  if(newDesc===null)return;
  const newPrice=parseInt(prompt('مبلغ جدید (ریال):',e.price));
  if(isNaN(newPrice)||newPrice<=0)return alert('⚠️ مبلغ نامعتبر');
  const newSent=confirm('ارسال شده؟');
  const newPaid=confirm('پرداخت شده؟');
  c.engines[idx]={...e,desc:newDesc,price:newPrice,sent:newSent,paid:newPaid};
  save();
  renderEngines();
  renderCustomers();
}

function prepareInvoice(){
  const c=data.customers.find(x=>x.id===currentId);
  document.getElementById('inv-name').textContent=c.name;
  document.getElementById('inv-number').textContent=data.invoice++;
  const tbody=document.getElementById('invoice-body');
  tbody.innerHTML='';
  let total=0;
  c.engines.forEach((e,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+(i+1)+'</td><td>'+e.desc+'</td><td>'+formatPrice(e.price)+'</td><td>'+(e.sent?'✅':'❌')+'</td><td>'+(e.paid?'✅':'❌')+'</td>';
    tbody.appendChild(tr);
    if(!e.paid)total+=e.price;
  });
  document.getElementById('inv-total').textContent=formatPrice(total);
  save();
}

function printInvoice(){
  prepareInvoice();
  document.getElementById('invoice').style.display='block';
  window.print();
  document.getElementById('invoice').style.display='none';
}

function saveAsImage(){
  prepareInvoice();
  const inv=document.getElementById('invoice');
  inv.style.display='block';
  html2canvas(inv,{scale:2}).then(canvas=>{
    const link=document.createElement('a');
    link.download='فاکتور_'+document.getElementById('inv-number').textContent+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }).finally(()=>inv.style.display='none');
}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='backup_'+new Date().toLocaleDateString('fa-IR')+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);
      if(imported.customers&&Array.isArray(imported.customers)){
        data=imported;
        save();
        renderCustomers();
        alert('✅ اطلاعات با موفقیت بارگذاری شد');
      }else{
        alert('❌ فرمت فایل نامعتبر');
      }
    }catch(e){
      alert('❌ فایل نامعتبر');
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

// ===== دکمه برگشت فیزیکی =====
// برای PWA
document.addEventListener('backbutton', function(e) {
  e.preventDefault();
  if (document.getElementById('customer-page').style.display === 'block') {
    backToMain();
  } else {
    if (confirm('❌ خروج از برنامه؟')) {
      navigator.app.exitApp();
    }
  }
}, false);

// برای مرورگر معمولی
window.addEventListener('popstate', function(e) {
  if (document.getElementById('customer-page').style.display === 'block') {
    backToMain();
    history.pushState(null, null, window.location.href);
  }
});

// ذخیره حالت برای popstate
history.pushState(null, null, window.location.href);

renderCustomers();
</script>
</body>
</html>
